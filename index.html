<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MataSelam</title>
<meta name="description" content="MataSelam is an offline-first mobile app that identifies Indo-Pacific marine life from a photo, for divers and snorkelers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14202a;
    --muted: #5b6b73;
    --bg: #f7f5f0;
    --accent: #1f6f78;
    --border: #e2ddd2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    max-width: 560px;
    text-align: center;
  }
  h1 {
    font-family: 'Lora', Georgia, serif;
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 2.75rem);
    margin: 0 0 12px;
    color: var(--ink);
  }
  p.tagline {
    font-size: 1.1rem;
    color: var(--muted);
    margin: 0 0 32px;
    line-height: 1.5;
  }
  .status {
    display: inline-block;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 6px 16px;
    margin-bottom: 28px;
  }
  .contact {
    font-size: 0.95rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 20px;
    margin-top: 8px;
  }
  .contact a {
    color: var(--accent);
    text-decoration: none;
  }
  .contact a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main>
    <div class="status">In development</div>
    <h1>MataSelam</h1>
    <p class="tagline">
      An offline-first mobile app that identifies Indo-Pacific marine life from a photo &mdash;
      built for divers and snorkelers.
    </p>
    <div class="contact">
      Get in touch: <a href="mailto:jesse@mataselam.com">jesse@mataselam.com</a>
    </div>
  </main>
</body>
</html>
